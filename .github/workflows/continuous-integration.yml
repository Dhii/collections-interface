name: Continuous Integration
on:
  pull_request:
    branches:
      - '*.*.*'
      - 'master'
  push:
    branches:
      - '*.*.*'
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Analysing source code
        run: find ./src/ ./inc/ ./tests/ -type f -name '*.php' -print0 | xargs -0 -L 1 -P 4 -- php -l

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-suggest

      - name: PhpUnit
        run: ./vendor/bin/phpunit

      - name: Psalm
        run: ./vendor/bin/psalm --threads=8 --diff

      - name: PHPCS
        run: ./vendor/bin/phpcs -s --report-source --runtime-set ignore_warnings_on_exit 1
